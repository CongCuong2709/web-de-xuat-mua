{% load static %}<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4FD1">
<title>{% block title %}Đề xuất mua sắm{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/app.css' %}">
<script src="{% static 'vendor/htmx.min.js' %}" defer></script>
<script src="{% static 'vendor/alpine.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
{% block body %}
<div class="shell">
  <nav class="nav">
    <div class="nav-brand">Đề xuất</div>
    <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}is-active{% endif %}">Chờ tôi xử lý</a>
    <div class="nav-spacer"></div>
    <div class="nav-user">
      <a href="{% url 'profile' %}" class="nav-link nav-user-name {% if request.resolver_match.url_name == 'profile' %}is-active{% endif %}">{{ user.display_name }}</a>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}" class="nav-link">Quản trị</a>{% endif %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="nav-link nav-logout">Đăng xuất</button></form>
    </div>
  </nav>
  <main class="main">
    {% for m in messages %}<div class="flash flash-{{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
</body>
</html>
